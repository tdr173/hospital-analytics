global
    log stdout format raw daemon "info"
    pidfile /run/haproxy.pid
    maxconn 4000
    server-state-file /var/lib/haproxy/server-state

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option redispatch
    retries 3
    timeout http-request 10s
    timeout queue 1m
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout http-keep-alive 10s
    timeout check 10s
    maxconn 3000

backend dockerbackend
    # Strip the /vX.Y version prefix from the path before forwarding,
    # because Docker Desktop's daemon (API 1.44+) rejects old prefixes
    # like /v1.24 with HTTP 400. Unversioned paths work fine.
    http-request replace-path ^/v[0-9.]+(/.*)$  \1
    server dockersocket /var/run/docker.sock

backend docker-events
    http-request replace-path ^/v[0-9.]+(/.*)$  \1
    server dockersocket /var/run/docker.sock
    timeout server 0

frontend dockerfrontend
    bind [::]:2375 v4v6
    http-request deny unless METH_GET

    # Allow only the endpoints Traefik needs (read-only).
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/_ping }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/version }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/info }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/events }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/containers }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/networks }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/services }
    http-request allow if { path,url_dec -m reg -i ^(/v[\d\.]+)?/tasks }
    http-request deny

    use_backend docker-events if { path,url_dec -m reg -i ^(/v[\d\.]+)?/events }
    default_backend dockerbackend
